[project]
name = "teams-agent-common"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "microsoft-agents-hosting-aiohttp==1.8.0",
  "microsoft-agents-authentication-msal==1.8.0",
  "azure-identity>=1.25,<2",
  "azure-core>=1.36,<2",
  "aiohttp>=3.12,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_agent_common"]
