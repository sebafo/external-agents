[project]
name = "teams-maf-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "teams-agent-common",
  "agent-framework-core==1.21.0",
  "agent-framework-openai==1.16.0",
]

[project.scripts]
teams-maf = "maf_agent.app:main"

[tool.uv.sources]
teams-agent-common = { path = "../../shared", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "debugpy>=1.8,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maf_agent"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
