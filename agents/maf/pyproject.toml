[project]
name = "teams-maf-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "agent-framework-core==1.21.0",
  "agent-framework-openai==1.16.0",
  "microsoft-agents-hosting-aiohttp==1.8.0",
  "microsoft-agents-authentication-msal==1.8.0",
  "azure-identity>=1.25,<2",
  "azure-core>=1.36,<2",
  "aiohttp>=3.12,<4",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
teams-maf = "maf_agent.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-aiohttp>=1.1,<2",
  "debugpy>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maf_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
